name: Code Quality Check

on: 
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps: 
          - name: Checkout Code
            uses: actions/checkout@v4


          - name: Set Up Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.11"

          - name: Install Linter
            run: pip install ruff

          - name: Run Linter
            run: ruff check .